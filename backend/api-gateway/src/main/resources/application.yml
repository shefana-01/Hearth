server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 3000
            # Long enough for a 20 MB upload on a slow connection.
            response-timeout: 60s
          default-filters:
            # Each service answers CORS headers too only if asked; keep one copy.
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          globalcors:
            cors-configurations:
              '[/api/**]':
                # The web app's address(es), comma-separated. Not needed when the app is served through the same address.
                allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173}
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"
                exposed-headers: X-Request-Id
                max-age: 3600
          # Only the public API is routed. /api/v1/internal/** (service-to-service) matches nothing here, so it is 404 from outside.
          routes:
            - id: family-service
              uri: ${FAMILY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/account/**,/api/v1/family/**,/api/v1/members/**,/api/v1/invites/**
            - id: task-service
              uri: ${TASK_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/tasks/**,/api/v1/events/**,/api/v1/unavailability/**
            - id: decision-service
              uri: ${DECISION_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/decisions/**,/api/v1/reassignment-requests/**,/api/v1/schedule/**
            - id: care-service
              uri: ${CARE_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/appointments/**,/api/v1/health/**,/api/v1/groceries/**,/api/v1/documents/**,/api/v1/caregraph/**
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**,/api/v1/messages/**
            - id: audit-service
              uri: ${AUDIT_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/v1/audit-events/**

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
