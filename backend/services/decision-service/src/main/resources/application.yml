server:
  port: 8083

spring:
  application:
    name: decision-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/hearth_decision}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:hearth_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

hearth:
  decision:
    priority-weights:
      deadline-urgency: 0.25
      care-criticality: 0.30
      dependency-impact: 0.20
      reassignment-difficulty: 0.10
      conflict-severity: 0.15
    suitability-weights:
      availability: 0.35
      workload-capacity: 0.25
      skill-eligibility: 0.25
      conflict-cost: 0.15

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
