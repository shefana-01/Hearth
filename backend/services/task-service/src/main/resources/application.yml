server:
  port: ${PORT:8082}
  shutdown: graceful

spring:
  application:
    name: task-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hearth_task}
    username: ${DB_USER:hearth}
    password: ${DB_PASSWORD:hearth}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        max.block.ms: 5000
    consumer:
      group-id: task-service
      auto-offset-reset: earliest
    listener:
      # Start even when Kafka is not up yet; the consumer connects when it is.
      missing-topics-fatal: false

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"

hearth:
  security:
    jwks-uri: ${JWKS_URI:http://localhost:8081/.well-known/jwks.json}
    issuer: ${JWT_ISSUER:hearth}
  outbox:
    enabled: true
  consumer:
    enabled: ${KAFKA_CONSUMERS:true}
  reminders:
    # How often to look for tasks that start within 15 minutes.
    poll-ms: 60000
  services:
    family: ${FAMILY_SERVICE_URL:http://localhost:8081}
