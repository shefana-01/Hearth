apiVersion: v1
kind: ConfigMap
metadata:
  name: hearth-config
  namespace: hearth
data:
  SPRING_PROFILES_ACTIVE: "prod"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
  MAIL_HOST: "mailpit"
  MAIL_PORT: "1025"
  FAMILY_SERVICE_URL: "http://family-service:8081"
  TASK_SERVICE_URL: "http://task-service:8082"
  DECISION_SERVICE_URL: "http://decision-service:8083"
  CARE_SERVICE_URL: "http://care-service:8084"
  NOTIFICATION_SERVICE_URL: "http://notification-service:8085"
  AUDIT_SERVICE_URL: "http://audit-service:8086"
---
apiVersion: v1
kind: Secret
metadata:
  name: hearth-secrets
  namespace: hearth
type: Opaque
stringData:
  POSTGRES_USER: "hearth"
  POSTGRES_PASSWORD: "hearth_secure_password"
  JWT_SECRET: "hearth-production-jwt-signing-secret-key-32-bytes-minimum"
