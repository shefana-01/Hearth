apiVersion: apps/v1
kind: Deployment
metadata:
  name: family-service
  namespace: hearth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: family-service
  template:
    metadata:
      labels:
        app: family-service
    spec:
      containers:
        - name: family-service
          image: hearth/family-service:latest
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: hearth-config
            - secretRef:
                name: hearth-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: family-service
  namespace: hearth
spec:
  ports:
    - port: 8081
      targetPort: 8081
  selector:
    app: family-service
---
