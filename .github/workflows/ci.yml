name: Hearth Monorepo CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (types, lint, format, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Typecheck, lint, format check and build
        working-directory: ./frontend
        run: npm run check

      # care-service reads the health-note, food and label lists as JSON generated from the frontend's
      # TypeScript. Fails if someone changed one side only.
      - name: Catalogues match the frontend
        run: node tools/catalogues.mjs --check

  backend:
    name: Backend (unit + integration tests, Java 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The decision engine exists twice (TypeScript in the frontend, Java in decision-service).
      # Regenerating the fixtures from the current engine.ts makes DecisionEngineParityTest fail
      # whenever the two drift apart.
      - name: Regenerate engine parity fixtures from the TypeScript engine
        run: |
          npm ci --prefix frontend
          node tools/engine-fixtures.mjs

      # The *IT tests start PostgreSQL and Neo4j with Testcontainers (Docker is available on the runner).
      - name: Build and test
        working-directory: ./backend
        run: mvn -B -ntp clean verify

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/**/target/surefire-reports/
          retention-days: 7

  e2e:
    name: End-to-end (docker compose)
    runs-on: ubuntu-latest
    needs: [ frontend, backend ]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build and start the whole system
        run: docker compose up --build --detach --wait --wait-timeout 900

      - name: Smoke test through the web app (nginx -> gateway -> services -> Kafka/Neo4j/Mailpit)
        run: node tools/e2e-smoke.mjs

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300

      - name: Stop
        if: always()
        run: docker compose down --volumes
