# Serves the built web app and forwards API calls to the gateway (see frontend/Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Document uploads are up to 20 MB.
    client_max_body_size 21m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://gateway:8080;
        # The full host with its port, so the gateway sees a call from this page as same-origin (not CORS).
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built files have a content hash in their name, so they can be cached for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Every other path is a page of the app (React Router handles it).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
